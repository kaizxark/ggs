<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="Global Kids School — a calmer operating system for modern school leadership." />
    <!-- Round logo. The favicons are the full emblem rather than a zoomed crop:
         cropping it turned into an unreadable egg at tab size, and the whole
         mark keeps its circular silhouette down to 32px. Transparent PNG rather
         than .ico so the round edge survives on dark browser chrome. -->
    <!-- Browsers request /favicon.ico unprompted even when the icons below are
         declared. Without a real file there, the request fell through to the
         SPA rewrite and answered with the whole 368 KB index.html, which the
         browser then tried to parse as an icon. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png" />
    <!-- iOS masks the icon itself, so this one is composited onto an opaque
         white plate; a transparent circle would show as black corners. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon-128.png" color="#3fb8a2" />
    <title>Global Kids School · School OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Analytics is not wired up. The tag used to interpolate its endpoint from an
      environment variable that is not set, so it shipped as a literal request
      for a non-existent path - a wasted round trip to the site itself on every
      page load, and a Vite build warning each time. The script is only injected
      once both variables are actually set, so it costs nothing until analytics
      is configured.

      (This comment deliberately spells the variables without the surrounding
      percent signs Vite scans for, which is what was triggering the warning.)

      To enable it, set VITE_ANALYTICS_ENDPOINT and VITE_ANALYTICS_WEBSITE_ID.
    -->
    <script>
      // Vite only substitutes the percent-delimited form in HTML, so the values
      // are read that way. `import.meta.env` is a module-only construct and
      // throws in a classic inline script, which is what the first attempt here
      // did on every page load.
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var siteId = "%VITE_ANALYTICS_WEBSITE_ID%";

        // Unset variables are left as the literal token by Vite, so anything
        // still wrapped in percent signs is a placeholder, not a real value.
        if (/^%.*%$/.test(endpoint) || /^%.*%$/.test(siteId) || !endpoint || !siteId) return;

        var tag = document.createElement("script");
        tag.defer = true;
        tag.src = endpoint + "/umami";
        tag.setAttribute("data-website-id", siteId);
        document.head.appendChild(tag);
      })();
    </script>
  </body>
</html>
