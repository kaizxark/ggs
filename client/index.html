<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f7f3eb" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Global Kids School — a calmer operating system for modern school leadership." />

    <!-- Round logo. The favicons are the full emblem rather than a zoomed crop:
         cropping it turned into an unreadable egg at tab size, and the whole
         mark keeps its circular silhouette down to 32px. Transparent PNG rather
         than .ico so the round edge survives on dark browser chrome. -->
    <link rel="icon" type="image/svg+xml" href="/global-kids-logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-64.png" />
    <!-- iOS masks the icon itself, so this one is composited onto an opaque
         white plate; a transparent circle would show as black corners. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon-128.png" color="#001884" />
    <title>Global Kids</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
