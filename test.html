<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"><style>
:root { --gesso-canvas: #f6eddd; }
* { box-sizing: border-box; }
html { background: var(--gesso-canvas); }
body { margin: 0; min-width: 320px; background: var(--gesso-canvas); }
.wrap { min-height: 100vh; background: white; }
.sec { height: 400px; border: 2px dashed #ccc; padding: 20px; }
iframe { width: 100%; height: 130vh; border: none; zoom: 1.3; display: block; }
.outer { height: 130vh; overflow-y: auto; position: relative; }
</style></head><body>
<h1>HTML structural body scroll test</h1>
<div class="wrap">
  <div class="sec">Section 1</div>
  <div class="sec">Section 2</div>
  <div class="outer"><iframe src="about:blank"></iframe></div>
</div>
</body></html>
